<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101221">
  <title>AI Project Intelligence &amp; Risk Advisor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="AI Project Intelligence and Risk Advisor home">
        <span class="brand-icon">🤖</span>
        <span>AI Project<br><strong>Intelligence &amp; Risk<br>Advisor</strong></span>
      </a>

      <nav class="navigation" id="navigation" aria-label="Main navigation">
        <button class="nav-item active" data-page="upload"><span>📥</span> Upload</button>
        <button class="nav-item" data-page="dashboard"><span>📊</span> Dashboard</button>
        <button class="nav-item" data-page="scope"><span>🎯</span>Project Scope</button>
        <button class="nav-item" data-page="risks"><span>⚠️</span> Risks</button>
        <button class="nav-item" data-page="documents"><span>📝</span> Generated Docs</button>
        <button class="nav-item" data-page="assistant"><span>💬</span> Assistant</button>
      </nav>

      <div class="sidebar-footer">
        <span class="status-dot"></span>
        <span>Project workspace</span>
      </div>
    </aside>

    <main class="main-content">
      <header class="mobile-header">
        <span class="brand-icon">🤖</span>
        <strong>AI Project Intelligence &amp; Risk Advisor</strong>
        <button class="mobile-menu" id="mobileMenu" aria-label="Toggle navigation">☰</button>
      </header>
      <div class="page-container" id="pageContent" aria-live="polite">
        <div class="loading">Loading project workspace…</div>
      </div>
      <div class="toast" id="toast" role="status"></div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
